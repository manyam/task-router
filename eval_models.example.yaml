run:
  max_cost_per_task_usd: 1.00
  max_output_tokens: 2048
  max_tool_calls: 12
  max_tool_output_chars: 20000
  timeout_seconds: 90

# Copy this file to eval_models.local.yaml. Exactly three models are required.
# Credential values are read from the named environment variables and are never
# copied into run artifacts.
models:
  - alias: low
    role: low
    catalog_model_id: openai/gpt-5-mini
    api_model: replace-with-provider-model-id
    base_url: https://api.example.com/v1
    api_key_env: TASK_ROUTER_LOW_API_KEY
    input_per_million_usd: 0.125
    output_per_million_usd: 1.00
    cached_input_per_million_usd: 0.0125

  - alias: middle
    role: middle
    catalog_model_id: google/gemini-3.6-flash
    api_model: replace-with-provider-model-id
    base_url: https://api.example.com/v1
    api_key_env: TASK_ROUTER_MIDDLE_API_KEY
    input_per_million_usd: 0.75
    output_per_million_usd: 3.75
    cached_input_per_million_usd: 0.075

  - alias: premium
    role: premium
    catalog_model_id: anthropic/claude-opus-5
    api_model: replace-with-provider-model-id
    base_url: https://api.example.com/v1
    api_key_env: TASK_ROUTER_PREMIUM_API_KEY
    input_per_million_usd: 5.00
    output_per_million_usd: 25.00
    cached_input_per_million_usd: 0.50
